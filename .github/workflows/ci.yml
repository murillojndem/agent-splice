name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    # Windows is a first-class development and deployment path (docs/SPECIFICATION.md NFR 14.5), so
    # both platforms gate the build rather than Linux gating and Windows reporting.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK band is pinned by global.json; this installs a matching 8.0 SDK.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Build
        # Warnings are already errors via Directory.Build.props; this guards against a project that
        # opts out locally.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  dashboard:
    # The dashboard is optional (FR-DASH-002) and gated separately, so a broken .NET build and a
    # broken dashboard build report as two findings rather than one. Linux only: it produces static
    # assets, and nothing about that is platform-dependent — unlike the gateway, where Windows is a
    # first-class deployment path and therefore gates.
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/AgentSplice.Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/AgentSplice.Dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
