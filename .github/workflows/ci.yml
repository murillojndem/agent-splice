name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole suite against the tag before it publishes anything, and
  # publishes the Windows package this run uploads (ADR 0018).
  workflow_call:

permissions:
  contents: read

concurrency:
  # Literal "ci-", never the workflow's name: called from the release, github.workflow would name the
  # release, and a group shared with the caller deadlocks it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    # Windows is a first-class development and deployment path (docs/SPECIFICATION.md NFR 14.5), so
    # both platforms gate the build rather than Linux gating and Windows reporting.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK band is pinned by global.json; this installs a matching 8.0 SDK.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Build
        # Warnings are already errors via Directory.Build.props; this guards against a project that
        # opts out locally.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  dashboard:
    # The dashboard is optional (FR-DASH-002) and gated separately, so a broken .NET build and a
    # broken dashboard build report as two findings rather than one. Linux only: it produces static
    # assets, and nothing about that is platform-dependent — unlike the gateway, where Windows is a
    # first-class deployment path and therefore gates.
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/AgentSplice.Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/AgentSplice.Dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    # The alpha ships as this image, and the image is where the dashboard is built into the gateway
    # (ADR 0015). Nothing else builds it, which is how two Dockerfile defects once stayed latent since
    # the projects existed. It goes through Compose because that is the path an alpha user takes.
    name: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose an administrative token
        # Compose refuses to start without one, and the smoke test needs it to prove /api/v1 still
        # requires it. Generated per run and masked, so no token is written into the repository.
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "AGENTSPLICE_ADMIN_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Build, start, and wait until healthy
        # --wait returns once the image's own HEALTHCHECK reports healthy (ADR 0016), and fails if it
        # reports unhealthy or the timeout passes — so the health check the image ships is what
        # decides that the gateway is up, as it is for `docker compose up --wait` anywhere else.
        run: docker compose up --build --detach --wait --wait-timeout 120 agentsplice

      - name: Smoke test
        run: bash .github/scripts/smoke-gateway.sh http://127.0.0.1:5280 "$AGENTSPLICE_ADMIN_API_KEY"

      - name: Health check
        # What the probe reported, and proof that it can fail: a health check that always passed
        # would satisfy --wait just as well. Against a port nothing listens on, and against a target
        # it must refuse, it exits exactly 1 — never 2, which Docker reserves.
        run: |
          container="$(docker compose ps --quiet agentsplice)"
          docker inspect --format '{{json .State.Health.Log}}' "$container"
          status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
          if [ "$status" != "healthy" ]; then
            echo "The container reports '$status', not healthy." >&2
            exit 1
          fi
          for target in http://127.0.0.1:5999/health/live https://example.com/; do
            set +e
            docker compose exec -T agentsplice dotnet /app/probe/AgentSplice.HealthProbe.dll "$target"
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "The probe exited $code against $target; expected 1." >&2
              exit 1
            fi
          done

      - name: Startup log
        # Written to a file first: piping `docker compose logs` straight into `grep -q` lets grep exit
        # early and the writer die of SIGPIPE, which fails the step under the runner's pipefail.
        # Each pattern matches the simple console formatter and the JSON one.
        run: |
          docker compose logs --no-color agentsplice > "$RUNNER_TEMP/agentsplice.log"
          if ! grep -Eq '\[1203\]|"EventId":1203' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image did not announce the dashboard (event 1203)." >&2
            exit 1
          fi
          if grep -Eq '\[1204\]|"EventId":1204' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image found no dashboard build (event 1204)." >&2
            exit 1
          fi
          # The store the volume holds, named at startup (ADR 0017).
          if ! grep -Eq '\[1305\]|"EventId":1305' "$RUNNER_TEMP/agentsplice.log" \
             || ! grep -Fq '/data/agentsplice.db' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image did not report its store at /data/agentsplice.db (event 1305)." >&2
            exit 1
          fi

      - name: License and labels
        # The image carries the license and notices it is distributed under, exactly as the repository
        # has them, and labels naming the license and the repository (ADR 0020). A fork's image still
        # names this repository, so a mismatch there fails only a tag's run and only warns otherwise.
        run: |
          container="$(docker compose ps --quiet agentsplice)"
          for notice in LICENSE NOTICE THIRD-PARTY-NOTICES.md; do
            docker cp "$container:/app/$notice" "$RUNNER_TEMP/$notice"
            if ! cmp --silent "$notice" "$RUNNER_TEMP/$notice"; then
              echo "The image's /app/$notice is not the repository's $notice." >&2
              exit 1
            fi
          done
          image="$(docker inspect --format '{{.Image}}' "$container")"
          licenses="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image")"
          if [ "$licenses" != "Apache-2.0" ]; then
            echo "The image's license label is '$licenses', not Apache-2.0." >&2
            exit 1
          fi
          source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")"
          if [ "$source" != "https://github.com/$GITHUB_REPOSITORY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "The image's source label names $source, not https://github.com/$GITHUB_REPOSITORY." >&2
              exit 1
            fi
            echo "::warning::The image's source label names $source, not https://github.com/$GITHUB_REPOSITORY."
          fi

      - name: Dump the log and stop
        if: always()
        run: |
          docker compose logs --no-color agentsplice || true
          docker compose down --volumes || true

  package-windows:
    # The Windows package is the other way an alpha user installs AgentSplice, and the one that needs
    # no Docker and no .NET SDK (ADR 0017). Built and started here on every change, like the image, so
    # a packaging defect fails a pull request rather than a release. Windows, because the package is a
    # Windows executable and because only the Windows file system can prove the backslash traversal
    # checks. The artifact it uploads is what a tagged release publishes.
    name: package (win-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The package carries the runtime of the SDK that builds it, so this is also which .NET 8
          # patch — and which security fixes — a release ships with.
          dotnet-version: '8.0.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Exact, as in the Dockerfile: this builds a release artifact.
          version: 10.30.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/AgentSplice.Dashboard/pnpm-lock.yaml

      - name: Build the package
        run: ./.github/scripts/package-windows.ps1 -OutputDirectory artifacts/package

      - name: Smoke test the package
        run: |
          $archive = Get-ChildItem artifacts/package -Filter 'agentsplice-*-win-x64.zip' | Select-Object -First 1
          ./.github/scripts/smoke-windows-package.ps1 -Archive $archive.FullName -Bash "$env:ProgramFiles\Git\bin\bash.exe"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: agentsplice-win-x64
          path: |
            artifacts/package/*.zip
            artifacts/package/SHA256SUMS
          if-no-files-found: error
