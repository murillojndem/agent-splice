name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    # Windows is a first-class development and deployment path (docs/SPECIFICATION.md NFR 14.5), so
    # both platforms gate the build rather than Linux gating and Windows reporting.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK band is pinned by global.json; this installs a matching 8.0 SDK.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Build
        # Warnings are already errors via Directory.Build.props; this guards against a project that
        # opts out locally.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error
