name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole suite against the tag before it publishes anything, and
  # publishes the agentsplice-release artifact this run's release-assets job assembles — by its ID, so
  # an artifact some other job re-uploaded under the same name is never what it publishes (ADR 0018,
  # ADR 0021).
  workflow_call:
    outputs:
      release-artifact-id:
        description: The ID of the agentsplice-release artifact release-assets uploaded.
        value: ${{ jobs.release-assets.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  # Literal "ci-", never the workflow's name: called from the release, github.workflow would name the
  # release, and a group shared with the caller deadlocks it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    # Windows is a first-class development and deployment path (docs/SPECIFICATION.md NFR 14.5), so
    # both platforms gate the build rather than Linux gating and Windows reporting.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK band is pinned by global.json; this installs a matching 8.0 SDK.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes

      - name: Build
        # Warnings are already errors via Directory.Build.props; this guards against a project that
        # opts out locally.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  dashboard:
    # The dashboard is optional (FR-DASH-002) and gated separately, so a broken .NET build and a
    # broken dashboard build report as two findings rather than one. Linux only: it produces static
    # assets, and nothing about that is platform-dependent — unlike the gateway, where Windows is a
    # first-class deployment path and therefore gates.
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/AgentSplice.Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/AgentSplice.Dashboard/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    # The alpha ships as this image, and the image is where the dashboard is built into the gateway
    # (ADR 0015). Nothing else builds it, which is how two Dockerfile defects once stayed latent since
    # the projects existed. It is started through Compose because that is the path a user of a clone
    # takes, and the image every step checked is saved as the archive a release carries and pushes to
    # the registry when the release is published (ADR 0022).
    name: image
    # The classic image store: a saved image keeps the config every step below checked, and a push
    # from it is one manifest. ubuntu-latest moves to a release whose Docker defaults to the containerd
    # store, where neither holds the same way; moving off this pin is a decision for ADR 0022.
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose an administrative token
        # Compose refuses to start without one, and the smoke test needs it to prove /api/v1 still
        # requires it. Generated per run and masked, so no token is written into the repository.
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "AGENTSPLICE_ADMIN_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Build the image
        # Built by docker rather than by Compose, which labels the images it builds with its project, and
        # with no provenance or SBOM attestation, which would make the image an index; on the containerd
        # store the saved archive would not be the image the checks below ran.
        run: |
          if docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter'; then
            echo "This runner's Docker uses the containerd image store; the image job assumes the classic one." >&2
            exit 1
          fi
          docker build --provenance=false --sbom=false --tag agentsplice:dev .

      - name: Start, and wait until healthy
        # --wait returns once the image's own HEALTHCHECK reports healthy (ADR 0016), and fails if it
        # reports unhealthy or the timeout passes — so the health check the image ships is what
        # decides that the gateway is up, as it is for `docker compose up --wait` anywhere else.
        run: docker compose up --no-build --detach --wait --wait-timeout 120 agentsplice

      - name: Smoke test
        run: bash .github/scripts/smoke-gateway.sh http://127.0.0.1:5280 "$AGENTSPLICE_ADMIN_API_KEY"

      - name: Health check
        # What the probe reported, and proof that it can fail: a health check that always passed
        # would satisfy --wait just as well. Against a port nothing listens on, and against a target
        # it must refuse, it exits exactly 1 — never 2, which Docker reserves.
        run: |
          container="$(docker compose ps --quiet agentsplice)"
          docker inspect --format '{{json .State.Health.Log}}' "$container"
          status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
          if [ "$status" != "healthy" ]; then
            echo "The container reports '$status', not healthy." >&2
            exit 1
          fi
          for target in http://127.0.0.1:5999/health/live https://example.com/; do
            set +e
            docker compose exec -T agentsplice dotnet /app/probe/AgentSplice.HealthProbe.dll "$target"
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "The probe exited $code against $target; expected 1." >&2
              exit 1
            fi
          done

      - name: Startup log
        # Written to a file first: piping `docker compose logs` straight into `grep -q` lets grep exit
        # early and the writer die of SIGPIPE, which fails the step under the runner's pipefail.
        # Each pattern matches the simple console formatter and the JSON one.
        run: |
          docker compose logs --no-color agentsplice > "$RUNNER_TEMP/agentsplice.log"
          if ! grep -Eq '\[1203\]|"EventId":1203' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image did not announce the dashboard (event 1203)." >&2
            exit 1
          fi
          if grep -Eq '\[1204\]|"EventId":1204' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image found no dashboard build (event 1204)." >&2
            exit 1
          fi
          # The store the volume holds, named at startup (ADR 0017).
          if ! grep -Eq '\[1305\]|"EventId":1305' "$RUNNER_TEMP/agentsplice.log" \
             || ! grep -Fq '/data/agentsplice.db' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The image did not report its store at /data/agentsplice.db (event 1305)." >&2
            exit 1
          fi

      - name: License and labels
        # The image carries the license and notices it is distributed under, exactly as the repository
        # has them, and labels naming the license and the repository (ADR 0020). A fork's image still
        # names this repository, so a mismatch there fails only a tag's run and only warns otherwise.
        run: |
          container="$(docker compose ps --quiet agentsplice)"
          for notice in LICENSE NOTICE THIRD-PARTY-NOTICES.md; do
            docker cp "$container:/app/$notice" "$RUNNER_TEMP/$notice"
            if ! cmp --silent "$notice" "$RUNNER_TEMP/$notice"; then
              echo "The image's /app/$notice is not the repository's $notice." >&2
              exit 1
            fi
          done
          image="$(docker inspect --format '{{.Image}}' "$container")"
          licenses="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image")"
          if [ "$licenses" != "Apache-2.0" ]; then
            echo "The image's license label is '$licenses', not Apache-2.0." >&2
            exit 1
          fi
          source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")"
          if [ "$source" != "https://github.com/$GITHUB_REPOSITORY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "The image's source label names $source, not https://github.com/$GITHUB_REPOSITORY." >&2
              exit 1
            fi
            echo "::warning::The image's source label names $source, not https://github.com/$GITHUB_REPOSITORY."
          fi

      - name: Save the image a release carries
        # The image every step above checked, under the name the registry will give it, as the archive a
        # release carries and publish-image.yml pushes when the release is published (ADR 0022). Its
        # version is the one the gateway inside it reports, so the name cannot drift from the build.
        run: |
          container="$(docker compose ps --quiet agentsplice)"
          image="$(docker inspect --format '{{.Image}}' "$container")"
          # Compose labels the images it builds; one carried into a published image would make every
          # container run from it look like part of somebody's Compose project.
          if ! docker image inspect --format '{{json .Config.Labels}}' "$image" \
               | jq -e 'keys | map(select(startswith("com.docker.compose."))) | length == 0' > /dev/null; then
            echo "The image carries Compose's labels." >&2
            exit 1
          fi
          version="$(curl -fsS -H "Authorization: Bearer $AGENTSPLICE_ADMIN_API_KEY" http://127.0.0.1:5280/api/v1/system | jq -er .version)"
          version="${version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The gateway reports '$version', which is not a version an image can be tagged with." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The image is version $version, but the tag is $GITHUB_REF_NAME." >&2
            exit 1
          fi
          reference="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          docker tag "$image" "$reference"
          mkdir -p artifacts/image
          archive="agentsplice-$version-image-linux-amd64.tar.gz"
          docker save "$reference" | gzip -n > "artifacts/image/$archive"
          (cd artifacts/image && sha256sum "$archive" > SHA256SUMS)

      - name: Upload the image
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: agentsplice-image-linux-amd64
          path: |
            artifacts/image/*.tar.gz
            artifacts/image/SHA256SUMS
          if-no-files-found: error
          # The release that consumes it runs in this same workflow run.
          retention-days: 7
          # The archive is compressed already.
          compression-level: 0

      - name: Dump the log and stop
        if: always()
        run: |
          docker compose logs --no-color agentsplice || true
          docker compose down --volumes || true

  image-archive:
    # The image as a user receives it (ADR 0022): the archive a release carries, loaded on a runner that
    # never built it, and started with the docker run command docs/INSTALLATION.md gives — a contract
    # test holds the two to the same flags. The image job proved the image under Compose; this proves
    # the archive and the path a user of the published image takes.
    name: image (archive)
    needs: image
    # The classic image store, as for the image job.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        # For smoke-gateway.sh; nothing is built here.
        uses: actions/checkout@v4

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: artifacts/image

      - name: Verify, read, and load the archive
        run: |
          mapfile -t sums < <(find artifacts/image -maxdepth 2 -type f -name SHA256SUMS)
          if [ "${#sums[@]}" -ne 1 ]; then
            echo "The image artifact holds no single SHA256SUMS." >&2
            exit 1
          fi
          cd "$(dirname "${sums[0]}")"
          sha256sum --check --strict SHA256SUMS
          archive="$(awk '{print $2}' SHA256SUMS)"
          version="${archive#agentsplice-}"
          version="${version%-image-linux-amd64.tar.gz}"
          reference="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          # What publish-image.yml checks before it loads anything: one image, named for this release.
          manifest="$(gzip -dc "$archive" | tar -xOf - manifest.json)"
          if ! jq -e --arg reference "$reference" 'length == 1 and .[0].RepoTags == [$reference]' <<< "$manifest" > /dev/null; then
            echo "The archive does not hold exactly one image named $reference." >&2
            exit 1
          fi
          docker load --input "$archive"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")"
          if [ "$platform" != "linux/amd64" ]; then
            echo "The image is $platform, not linux/amd64." >&2
            exit 1
          fi
          if ! docker image inspect --format '{{json .Config.Labels}}' "$reference" \
               | jq -e '(keys | map(select(startswith("com.docker.compose."))) | length == 0) and ."org.opencontainers.image.licenses" == "Apache-2.0"' > /dev/null; then
            echo "The image's labels are not the ones a published image carries." >&2
            exit 1
          fi
          echo "REFERENCE=$reference" >> "$GITHUB_ENV"

      - name: Run it as the installation guide does
        run: |
          AGENTSPLICE_ADMIN_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$AGENTSPLICE_ADMIN_API_KEY"
          echo "AGENTSPLICE_ADMIN_API_KEY=$AGENTSPLICE_ADMIN_API_KEY" >> "$GITHUB_ENV"
          export AGENTSPLICE_ADMIN_API_KEY
          docker run --detach --name agentsplice \
            --publish 127.0.0.1:5280:5280 \
            --volume agentsplice-data:/data \
            --add-host host.docker.internal:host-gateway \
            --env 'AGENTSPLICE__PERSISTENCE__CONNECTIONSTRING=Data Source=/data/agentsplice.db' \
            --env AGENTSPLICE__RUNTIMES__0__BASEURL=http://host.docker.internal:1234/v1 \
            --env AGENTSPLICE__ADMINISTRATION__APIKEYENVIRONMENTVARIABLE=AGENTSPLICE_ADMIN_API_KEY \
            --env AGENTSPLICE_ADMIN_API_KEY \
            "$REFERENCE"
          # The image's own health check decides when the gateway is up, as docker ps shows a user.
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' agentsplice)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$(docker inspect --format '{{.State.Running}}' agentsplice)" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "The container did not become healthy; it is '$status'." >&2
          exit 1

      - name: Smoke test
        run: bash .github/scripts/smoke-gateway.sh http://127.0.0.1:5280 "$AGENTSPLICE_ADMIN_API_KEY"

      - name: The store is on the volume
        run: |
          docker logs agentsplice > "$RUNNER_TEMP/agentsplice.log" 2>&1
          if ! grep -Eq '\[1305\]|"EventId":1305' "$RUNNER_TEMP/agentsplice.log" \
             || ! grep -Fq '/data/agentsplice.db' "$RUNNER_TEMP/agentsplice.log"; then
            echo "The container did not report its store at /data/agentsplice.db (event 1305)." >&2
            exit 1
          fi

      - name: Dump the log and stop
        if: always()
        run: |
          docker logs agentsplice || true
          docker rm --force agentsplice || true
          docker volume rm agentsplice-data || true

  package-windows:
    # The Windows package is one of the two ways an alpha user installs AgentSplice without Docker or a
    # .NET SDK (ADR 0017). Built and started here on every change, like the image, so a packaging defect
    # fails a pull request rather than a release. Windows, because the package is a Windows executable
    # and because only the Windows file system can prove the backslash traversal checks. The artifact it
    # uploads is what a tagged release publishes, through release-assets, which takes it by its ID.
    name: package (win-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The package carries the runtime of the SDK that builds it, so this is also which .NET 8
          # patch — and which security fixes — a release ships with.
          dotnet-version: '8.0.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Exact, as in the Dockerfile: this builds a release artifact.
          version: 10.30.0

      - name: Set up Node
        # No dependency cache: a release artifact is built from the lockfile alone, never from a store
        # another job's run could have written.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package
        run: ./.github/scripts/package.ps1 -RuntimeIdentifier win-x64 -OutputDirectory artifacts/package

      - name: Smoke test the package
        run: |
          $archive = Get-ChildItem artifacts/package -Filter 'agentsplice-*-win-x64.zip' | Select-Object -First 1
          ./.github/scripts/smoke-package.ps1 -Archive $archive.FullName -Bash "$env:ProgramFiles\Git\bin\bash.exe"

      - name: Upload the package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: agentsplice-win-x64
          path: |
            artifacts/package/*.zip
            artifacts/package/SHA256SUMS
          if-no-files-found: error

  package-linux:
    # The Linux package (ADR 0021): the Windows package's twin for x64 distributions on glibc, built and
    # smoke-tested on Linux, where the archive can record the executable's permission bits and ss can see
    # the listener. The artifact it uploads is what a tagged release publishes, through release-assets.
    name: package (linux-x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # As for Windows: the package carries this SDK's runtime.
          dotnet-version: '8.0.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node
        # No dependency cache, as for Windows.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package
        run: ./.github/scripts/package.ps1 -RuntimeIdentifier linux-x64 -OutputDirectory artifacts/package

      - name: Smoke test the package
        run: |
          $archive = Get-ChildItem artifacts/package -Filter 'agentsplice-*-linux-x64.tar.gz' | Select-Object -First 1
          ./.github/scripts/smoke-package.ps1 -Archive $archive.FullName -Bash bash

      - name: Upload the package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: agentsplice-linux-x64
          path: |
            artifacts/package/*.tar.gz
            artifacts/package/SHA256SUMS
          if-no-files-found: error

  release-assets:
    # What a release publishes, assembled from what the jobs it needs built and checked (ADR 0021): every
    # archive, verified against its own digest, with one SHA256SUMS for all of them. It runs on every
    # change, so a defect in putting a release together fails a pull request rather than a tag.
    #
    # It takes each artifact by the ID its job reported, not by name: any job in this run can re-upload
    # an artifact under an existing name, archive and SHA256SUMS together, and a digest check against a
    # file that came in the same artifact would still pass. A re-uploaded artifact has another ID, so the
    # download fails instead. It checks nothing out and installs nothing.
    name: release assets
    # The image archive only once image-archive has loaded and run it the way the guide does.
    needs: [package-windows, package-linux, image, image-archive]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Download the Windows package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package-windows.outputs.artifact-id }}
          path: artifacts/windows

      - name: Download the Linux package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package-linux.outputs.artifact-id }}
          path: artifacts/linux

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: artifacts/image

      - name: Verify each artifact and combine their digests
        run: |
          mkdir release
          for download in artifacts/*/; do
            # Downloaded by ID, an artifact's files can land in a folder named for it below the path; the
            # folder holding SHA256SUMS is the artifact either way, and there must be exactly one.
            mapfile -t sums < <(find "$download" -maxdepth 2 -type f -name SHA256SUMS)
            if [ "${#sums[@]}" -ne 1 ]; then
              echo "$download does not hold exactly one SHA256SUMS." >&2
              exit 1
            fi
            artifact="$(dirname "${sums[0]}")"
            # Each artifact is one archive and its own one-line SHA256SUMS, and the archive matches it.
            if [ "$(ls -A "$artifact" | wc -l)" -ne 2 ] || [ "$(wc -l < "$artifact/SHA256SUMS")" -ne 1 ]; then
              echo "$artifact must hold one archive and its SHA256SUMS line:" >&2
              ls -A "$artifact" >&2
              exit 1
            fi
            (cd "$artifact" && sha256sum --check --strict SHA256SUMS)
            cat "$artifact/SHA256SUMS" >> "$RUNNER_TEMP/SHA256SUMS"
            find "$artifact" -maxdepth 1 -type f ! -name SHA256SUMS -exec mv -t release/ -- {} +
          done
          LC_ALL=C sort -k 2 "$RUNNER_TEMP/SHA256SUMS" > release/SHA256SUMS

          # Exactly one archive per platform and the image's, all of one version, and nothing else.
          version="$(ls release | sed -nE 's/^agentsplice-(.+)-win-x64\.zip$/\1/p')"
          expected="$(printf '%s\n' SHA256SUMS "agentsplice-$version-image-linux-amd64.tar.gz" "agentsplice-$version-linux-x64.tar.gz" "agentsplice-$version-win-x64.zip" | LC_ALL=C sort)"
          if [ -z "$version" ] || [ "$(ls release | LC_ALL=C sort)" != "$expected" ]; then
            echo "The release assets are not the two packages and the image of one version:" >&2
            ls release >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The assets are version $version, but the tag is $GITHUB_REF_NAME." >&2
            exit 1
          fi
          (cd release && sha256sum --check --strict SHA256SUMS)

      - name: Upload the release assets
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: agentsplice-release
          # The folder's contents, at the artifact's root: what the release publishes, flat.
          path: release/
          if-no-files-found: error
          # The release that consumes it runs in this same workflow run, minutes later.
          retention-days: 7
          # The archives are compressed already.
          compression-level: 0
