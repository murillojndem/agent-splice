name: Release

# A tag v<version> becomes a draft pre-release carrying the Windows and Linux packages, the image as an
# archive, and one SHA256SUMS for all three (ADR 0018, ADR 0021, ADR 0022). Nothing is published until a
# maintainer reviews the draft and publishes it by hand. This workflow never reaches the registry:
# publishing the draft starts publish-image.yml, which pushes exactly the archive the draft carries.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # Never shared with CI's group, which the ci job below runs under: a reusable workflow that waits
  # on its own caller's group never starts.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  version:
    # The tag must name the version the build stamps, so the release's name, the package's file name,
    # and what /api/v1/system reports are one value. A tag that disagrees stops here, before anything
    # is built.
    name: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The tag names the build's version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/AgentSplice.Api/AgentSplice.Api.csproj -nologo -getProperty:Version | Out-String).Trim()
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            Write-Error "The tag is $env:GITHUB_REF_NAME, but the build's version is $version; tag v$version, or change VersionPrefix and VersionSuffix in Directory.Build.props."
            exit 1
          }

      - name: The release carries a license
        # Every artifact carries LICENSE, NOTICE, and THIRD-PARTY-NOTICES.md (ADR 0020). A release
        # without them would publish code nobody may pass on, so their absence stops it here, before
        # anything is built.
        run: |
          for notice in LICENSE NOTICE THIRD-PARTY-NOTICES.md; do
            if [ ! -f "$notice" ]; then
              echo "There is no $notice file. Every release carries it (ADR 0020)." >&2
              exit 1
            fi
          done

  ci:
    # The whole CI suite against the tagged commit: both platforms' tests, the dashboard, the image, and
    # both packages, which this run builds, smoke-tests, and assembles with the image into the release's
    # assets.
    name: ci
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    # The only job that can write to the repository, and it runs nothing it downloaded from a package
    # registry: no checkout, no restore, no install. It publishes exactly what CI built and checked: the
    # artifact release-assets uploaded, taken by the ID that job reported, so an artifact another job
    # re-uploaded under the same name is never what it publishes.
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ci.outputs.release-artifact-id }}
          path: release

      - name: Verify the digests, and that the assets are exactly this tag's
        run: |
          # Downloaded by ID, the files can land in a folder named for the artifact below the path.
          mapfile -t sums < <(find release -maxdepth 2 -type f -name SHA256SUMS)
          if [ "${#sums[@]}" -ne 1 ]; then
            echo "The release assets hold no single SHA256SUMS." >&2
            exit 1
          fi
          assets="$(dirname "${sums[0]}")"
          cd "$assets"
          sha256sum --check --strict SHA256SUMS
          # SHA256SUMS lists exactly this tag's archives, one per platform, and the folder holds nothing
          # else; the draft is then made of what it lists, so its assets and its digests cannot drift.
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf '%s\n' "agentsplice-$version-image-linux-amd64.tar.gz" "agentsplice-$version-linux-x64.tar.gz" "agentsplice-$version-win-x64.zip" | LC_ALL=C sort)"
          if [ "$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)" != "$expected" ] \
             || [ "$(ls -A | grep -vx SHA256SUMS | LC_ALL=C sort)" != "$expected" ]; then
            echo "The release assets are not exactly this tag's archives:" >&2
            ls -A >&2
            exit 1
          fi
          echo "ASSETS=$PWD" >> "$GITHUB_ENV"

      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mapfile -t assets < <(awk -v folder="$ASSETS" '{print folder "/" $2}' "$ASSETS/SHA256SUMS")
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          An experimental alpha. No compatibility claim is made for any client, model, or runtime; support claims require a dated conformance report (docs/CONFORMANCE.md).

          **Windows.** \`agentsplice-$version-win-x64.zip\` runs on 64-bit Windows 10 or 11 without Docker or a .NET installation. The package is not code signed. See docs/INSTALLATION.md.

          **Linux.** \`agentsplice-$version-linux-x64.tar.gz\` runs on x64 distributions based on glibc 2.34 or later, such as Ubuntu 22.04, Debian 12, or RHEL 9, with OpenSSL 1.1.1 or later, without Docker or a .NET installation. The package is not signed. See docs/INSTALLATION.md.

          **Checking a download.** \`SHA256SUMS\` lists every asset's SHA-256 digest; check the one you downloaded against its line before extracting it, as docs/INSTALLATION.md shows. GitHub shows each asset's digest too.

          **Docker.** Publishing this release pushes the image to \`ghcr.io/${GITHUB_REPOSITORY,,}:$version\`, for linux/amd64, and adds its digest to these notes. \`agentsplice-$version-image-linux-amd64.tar.gz\` is the same image, for a machine without registry access: check it against \`SHA256SUMS\`, then \`docker load --input\` it. See docs/INSTALLATION.md.

          What changed is in CHANGELOG.md at this tag.
          EOF
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "$ASSETS/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "AgentSplice $GITHUB_REF_NAME (experimental alpha)" \
            --notes-file "$RUNNER_TEMP/notes.md"
