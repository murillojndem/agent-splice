services:
  agentsplice:
    # The image this file builds. A name without a '/' is in Docker Hub's library namespace, where no
    # account can publish, so a pull can never fetch somebody else's image under it; and Compose builds
    # it rather than pulling. The published image is ghcr.io/murillojndem/agent-splice (ADR 0022).
    image: agentsplice:dev
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    # No healthcheck here on purpose: the image's own HEALTHCHECK applies (ADR 0016), so
    # `docker compose up --wait` and `docker compose ps` report it. It probes port 5280, the port
    # ASPNETCORE_URLS names below; change one and you must override healthcheck.test to match.
    # Configuration keys use the double-underscore form that
    # Microsoft.Extensions.Configuration maps onto the agentsplice section, so a Compose override and
    # an appsettings.json value address exactly the same setting.
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5280
      AGENTSPLICE__PERSISTENCE__MODE: ${AGENTSPLICE__PERSISTENCE__MODE:-Sqlite}
      AGENTSPLICE__PERSISTENCE__CONNECTIONSTRING: ${AGENTSPLICE__PERSISTENCE__CONNECTIONSTRING:-Data Source=/data/agentsplice.db}
      AGENTSPLICE__RUNTIMES__0__ID: lmstudio-local
      AGENTSPLICE__RUNTIMES__0__PROVIDER: lmstudio
      AGENTSPLICE__RUNTIMES__0__BASEURL: ${AGENTSPLICE__RUNTIMES__0__BASEURL:-http://host.docker.internal:1234/v1}
      # The gateway reads a key by variable name and never stores the value (FR-DATA-010).
      AGENTSPLICE__RUNTIMES__0__APIKEYENVIRONMENTVARIABLE: LM_STUDIO_API_KEY
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      # The runtime's timeouts are the shipped ones, and nothing here passes them through from .env:
      # connect 5 seconds, responseHeaders and firstByte 5 minutes, idleStream 60 seconds, total 10
      # minutes (ADR 0028). To change one, set it in a docker-compose.override.yml beside this file,
      # which Compose merges by itself, as docs/CLIENTS.md shows under "Troubleshooting".
      AGENTSPLICE__CAPTURE__CONTENTENABLED: ${AGENTSPLICE__CAPTURE__CONTENTENABLED:-false}
      # The administrative API serves stored evidence, and a container binds every interface inside
      # itself — the process cannot see that the host published the port on loopback only. So the
      # token is mandatory here and the gateway refuses to start without it (FR-HEALTH-006).
      #
      # As with every other secret, the gateway is told the variable name and never the value.
      AGENTSPLICE__ADMINISTRATION__APIKEYENVIRONMENTVARIABLE: AGENTSPLICE_ADMIN_API_KEY
      # Deliberately has no default. Compose fails with "variable is not set" naming this variable,
      # which is a better first experience than a container that starts with a token everybody knows.
      AGENTSPLICE_ADMIN_API_KEY: ${AGENTSPLICE_ADMIN_API_KEY:?set AGENTSPLICE_ADMIN_API_KEY in .env to a value you choose; the administrative API is unauthenticated without it}
      # Spans and metrics over OTLP. Off unless you turn it on, and nothing is sent anywhere until you
      # do. The default endpoint is the optional collector below, which must be started with it:
      #   docker compose --profile otel up
      # OTEL_EXPORTER_OTLP_ENDPOINT is deliberately not used: where telemetry goes is set here.
      AGENTSPLICE__TELEMETRY__OTLP__ENABLED: ${AGENTSPLICE__TELEMETRY__OTLP__ENABLED:-false}
      AGENTSPLICE__TELEMETRY__OTLP__ENDPOINT: ${AGENTSPLICE__TELEMETRY__OTLP__ENDPOINT:-http://otel-collector:4318}
      AGENTSPLICE__TELEMETRY__OTLP__PROTOCOL: ${AGENTSPLICE__TELEMETRY__OTLP__PROTOCOL:-HttpProtobuf}
      # The dashboard, built into the image and served on the same port at
      # http://127.0.0.1:5280/dashboard/ (ADR 0015). The page itself needs no credential; the evidence
      # it shows does, so paste AGENTSPLICE_ADMIN_API_KEY into its token field. Set to false for a
      # deployment that wants no browser-facing surface.
      AGENTSPLICE__DASHBOARD__ENABLED: ${AGENTSPLICE__DASHBOARD__ENABLED:-true}
    ports:
      # Bound to loopback on the host. AgentSplice traffic carries prompts and model output, so the
      # default must not be reachable from the local network (docs/SECURITY.md). The dashboard shares
      # this port.
      - "127.0.0.1:5280:5280"
    volumes:
      - agentsplice-data:/data
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional OpenTelemetry Collector (docs/SPECIFICATION.md 20.2), started only with the "otel"
  # profile. It receives OTLP on the Compose network and prints what arrives to its own log:
  #   docker compose logs -f otel-collector
  # No port is published on the host. Point config/otel-collector.yaml at a real backend to keep
  # the data; as shipped it is a way to see exactly what AgentSplice exports, and nothing more.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/agentsplice.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/agentsplice.yaml:ro

  # Scaffolding for a later stage. AgentSplice cannot use it: agentsplice:persistence:mode accepts
  # Sqlite or None in this build and refuses Postgres at startup, because no provider implements it
  # (FR-DATA-003). The service is kept so the Compose topology does not have to be invented later.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentsplice}
      POSTGRES_USER: ${POSTGRES_USER:-agentsplice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  agentsplice-data:
  postgres-data:
